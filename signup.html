<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Library System - Register Account</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-brand">
        <div class="brand-logo">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <h2>Smart Library</h2>
        <p>Create a New Portal Account</p>
      </div>

      <form id="form-register" onsubmit="handleSignup(); return false;">
        <div class="form-group" style="margin-bottom: 14px;">
          <label for="username"><i class="fa-solid fa-user"></i> Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="user@library.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create strong password" required>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label for="confirmPassword"><i class="fa-solid fa-lock"></i> Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm password" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="role"><i class="fa-solid fa-user-shield"></i> System Role</label>
          <select id="role" name="role" class="form-control" required>
            <option value="">Select User Role...</option>
            <option value="MEMBER">MEMBER</option>
            <option value="LIBRARIAN">LIBRARIAN</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 13px;">
        <span style="color: var(--text-dim);">Already have an account? </span>
        <a href="login.html" style="color: var(--primary-light); font-weight: 600; text-decoration: none;">Sign In</a>
      </div>

      <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-dim);">
        Smart Library System &bull; Account Registration
      </div>

    </div>
  </div>

  <script src="JS/CommonNav.js"></script>
  <script src="JS/Signup.js"></script>
</body>
</html>
