<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Library System - Portal Authentication</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-brand">
        <div class="brand-logo">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <h2>Smart Library</h2>
        <p>E-Book Rental & Management System</p>
      </div>

      <form id="form-login" onsubmit="handleLogin(); return false;">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="userName"><i class="fa-solid fa-user"></i> Username</label>
          <input type="text" id="userName" name="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 13px;">
        <span style="color: var(--text-dim);">Don't have an account? </span>
        <a href="signup.html" style="color: var(--primary-light); font-weight: 600; text-decoration: none;">Create Account</a>
      </div>

      <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-dim);">
        Smart Library System &bull; Secure JWT Authentication
      </div>

    </div>
  </div>

  <script src="JS/CommonNav.js"></script>
  <script src="JS/Login.js"></script>
</body>
</html>
